name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      save:
        description: 'Save Wheels'
        required: true
        default: false
        type: boolean


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: actions/github-script@v7
        id: conan-path-script
        env:
          WORKSPACE: "${{github.workspace}}"
        with:
          result-encoding: string
          script: |
            const { WORKSPACE } = process.env
            switch('${{runner.os}}'){
              case 'windows-latest':
                return `${WORKSPACE}\\ciwheelbuilder\\conan`;
              case 'ubuntu-latest':
                return `/host/${WORKSPACE}/ciwheelbuilder/conan`
              case 'macOS-latest':
                return `${WORKSPACE}/ciwheelbuilder/conan`
              default:
                return `${WORKSPACE}/ciwheelbuilder/conan`
            }
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip' # caching pip dependencies

      # Used to host cibuildwheel
      - name: Install cibuildwheel
        run: |
          python -m pip install --disable-pip-version-check uv
      - uses: actions/cache@v6
        id: cache-conan
        with:
          path: "${{steps.conan-path-script.outputs.result}}/.conan2"
          key: ${{ runner.os }}${{ hashFiles('**/conanfile.py') }}-${{ hashFiles('conan.lock') }}
      - name: Build wheels
        if: contains(matrix.os, 'windows')
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64
          uv run --only-group cibuildwheel --isolated cibuildwheel --output-dir wheelhouse
          uv run --only-group conan --isolated conan cache clean '*' --build --temp
        env:
           CONAN_USER_HOME: ${{steps.conan-path-script.outputs.result}}
           CONAN_HOME: ${{steps.conan-path-script.outputs.result}}\.conan2
      - name: Build wheels
        if: "!contains(matrix.os, 'windows')"
        run: |
          uv run --only-group cibuildwheel --isolated cibuildwheel --output-dir wheelhouse
          uv run --only-group conan --isolated conan cache clean
        env:
           CONAN_USER_HOME: ${{steps.conan-path-script.outputs.result}}
           CONAN_HOME: ${{steps.conan-path-script.outputs.result}}/.conan2

        #   CIBW_SOME_OPTION: value
      - uses: actions/upload-artifact@v7
        if:  ${{ inputs.save }}
        with:
          name: uiucprescon.ocr-wheels
          path: ./wheelhouse/*.whl